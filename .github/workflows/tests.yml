name: testes

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Unidade, distribuição de tiers, loja e nomes
        run: ./run_tests.sh
      - name: Simulação de economia
        run: timeout 600 godot --headless --path . -s sim/economy_sim.gd
      - name: Teste de fumaça do jogo (cena completa, headless)
        run: |
          godot --headless --path . --import >/dev/null 2>&1 || true
          out=$(timeout 300 godot --headless --path . -s tests/smoke_game.gd 2>&1); code=$?
          echo "$out" | grep -E "ok|FAIL|smoke:|SCRIPT ERROR"
          if echo "$out" | grep -q "SCRIPT ERROR"; then exit 1; fi
          exit $code
