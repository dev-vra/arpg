name: testes

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Unidade, distribuição de tiers, loja e nomes
        run: ./run_tests.sh
      - name: Simulação de economia
        run: timeout 600 godot --headless --path . -s sim/economy_sim.gd
